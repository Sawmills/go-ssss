name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  test:
    # trunk-ignore(actionlint/runner-label): Existing Namespace profile
    runs-on: namespace-profile-sawmills-runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'

      - name: Run tests
        run: go test -v ./...

  release-please:
    needs: test
    # trunk-ignore(actionlint/runner-label): Existing Namespace profile
    runs-on: namespace-profile-sawmills-runner
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: go 